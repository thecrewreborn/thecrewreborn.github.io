<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Crew Reborn – Stats</title>
<meta name="theme-color" content="#070b12">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css?v=22">
<style>
  .stats-top { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; }
  .stats-top a { color: var(--steel); text-decoration: none; font-weight: 600; }
  .stats-top a:hover { color: var(--cyan); }
  .tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tile { padding: 20px 20px 18px; }
  .tile b { display: block; font: 800 italic clamp(2.2rem, 7vw, 3.2rem)/1 "Barlow Condensed", sans-serif; color: var(--ice); }
  .tile span { color: var(--steel); font-weight: 600; }
  .tile.total b { color: var(--cyan); }
  .stats-h { margin: 2.4rem 0 .9rem; font: 800 italic 1.6rem/1.1 "Barlow Condensed", sans-serif; }
  .releases { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .releases th, .releases td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--line); }
  .releases th:first-child, .releases td:first-child { text-align: left; }
  .releases th { color: var(--steel); font-weight: 600; font-size: .9rem; }
  .releases small { display: block; color: var(--steel); font-size: .8rem; }
  .visitors { padding: 20px; }
  .visitors p { margin: 0 0 .6em; color: var(--steel); }
  .visitors a { color: var(--cyan); }
  .gc-tiles { grid-template-columns: repeat(2, 1fr); margin-bottom: 14px; }
  .visitors { background: none; box-shadow: none; padding: 0; clip-path: none; }
  .visitors::before { display: none; }
  .stats-foot { margin: 1.6rem 0 3rem; color: var(--steel); font-size: .9rem; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .stats-foot button { background: rgba(255,255,255,.09); color: var(--ice); border: 0; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  @media (max-width: 760px) { .tiles { grid-template-columns: 1fr 1fr; } .releases .opt { display: none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="stats-top"><a href="../">← The Crew Reborn</a><a href="#" id="lang">DE / EN</a></div>
  <h2 data-t="title">Statistics</h2>

  <ul class="tiles" id="tiles">
    <li class="panel tile total"><b id="tTotal">–</b><span data-t="total">Downloads in total</span></li>
    <li class="panel tile"><b id="tServer">–</b><span>Server</span></li>
    <li class="panel tile"><b id="tPS4">–</b><span data-t="ps4">PS4 patch</span></li>
    <li class="panel tile"><b id="tPC">–</b><span data-t="pc">PC patch</span></li>
  </ul>

  <h3 class="stats-h" data-t="perRelease">Per release</h3>
  <table class="releases">
    <thead><tr><th data-t="version">Version</th><th>Server</th><th data-t="ps4s">PS4</th><th data-t="pcs">PC</th><th class="opt" data-t="sum">Total</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5" data-t="loading">Loading…</td></tr></tbody>
  </table>

  <h3 class="stats-h" data-t="visitorsTitle">Website visitors</h3>
  <div class="panel visitors" id="visitors"><p data-t="visitorsPending">Visitor counting is not set up yet.</p></div>

  <p class="stats-foot"><span id="updated"></span><button type="button" id="refresh" data-t="refresh">Refresh</button>
    <span data-t="note">GitHub counts every download, so one person downloading twice counts twice.</span></p>
</main>

<script>
(function () {
  // GoatCounter site code once the account exists, e.g. "thecrewreborn" -> https://thecrewreborn.goatcounter.com
  const GOATCOUNTER = "knutwurst";
  const T = {
    de: {
      title: "Statistik", total: "Downloads insgesamt", ps4: "PS4-Patch", pc: "PC-Patch", perRelease: "Pro Version",
      version: "Version", ps4s: "PS4", pcs: "PC", sum: "Gesamt", loading: "Wird geladen…",
      visitorsTitle: "Besucher der Website", visitorsPending: "Die Besucherzählung ist noch nicht eingerichtet.",
      refresh: "Aktualisieren", note: "GitHub zählt jeden Download; lädt jemand zweimal, zählt das doppelt.",
      updated: "Stand", failed: "GitHub ist gerade nicht erreichbar.", pre: "Pre-Release",
      dashboard: "Zum Besucher-Dashboard (Seitenaufrufe, Besucher, Herkunft)",
      visitors: "Besucher insgesamt", views: "Seitenaufrufe", unique: "Eindeutige Besucher", closed: "Die öffentlichen Zähler sind in GoatCounter noch ausgeschaltet."
    },
    en: {
      title: "Statistics", total: "Downloads in total", ps4: "PS4 patch", pc: "PC patch", perRelease: "Per release",
      version: "Version", ps4s: "PS4", pcs: "PC", sum: "Total", loading: "Loading…",
      visitorsTitle: "Website visitors", visitorsPending: "Visitor counting is not set up yet.",
      refresh: "Refresh", note: "GitHub counts every download, so one person downloading twice counts twice.",
      updated: "Updated", failed: "GitHub cannot be reached right now.", pre: "Pre-release",
      dashboard: "Open the visitor dashboard (page views, visitors, referrers)",
      visitors: "visitors in total", views: "Page views", unique: "Unique visitors", closed: "The public counters are still switched off in GoatCounter."
    }
  };
  const asked = new URLSearchParams(location.search).get("lang");
  let lang = asked === "de" || asked === "en" ? asked : ((navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en");
  let releases = null;
  const t = (k) => T[lang][k];
  const n = (x) => x.toLocaleString(lang === "de" ? "de-DE" : "en-GB");

  function kind(name) {
    const m = /^TheCrewReborn-(Server|PS4|PC)-/.exec(name);
    return m ? m[1] : null;
  }

  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });
    if (!releases) return;
    const sum = { Server: 0, PS4: 0, PC: 0 };
    const rows = document.getElementById("rows");
    rows.replaceChildren();
    releases.forEach((r) => {
      const per = { Server: 0, PS4: 0, PC: 0 };
      r.assets.forEach((a) => { const k = kind(a.name); if (k) per[k] += a.download_count; });
      Object.keys(per).forEach((k) => { sum[k] += per[k]; });
      const tr = document.createElement("tr");
      const date = new Date(r.published_at).toLocaleDateString(lang === "de" ? "de-DE" : "en-GB",
        { day: "numeric", month: "short", year: "numeric" });
      const v = document.createElement("td");
      v.textContent = r.tag_name.replace(/^v/, "");
      const small = document.createElement("small");
      small.textContent = date + (r.prerelease ? " · " + t("pre") : "");
      v.append(small);
      tr.append(v);
      ["Server", "PS4", "PC"].forEach((k) => { const td = document.createElement("td"); td.textContent = n(per[k]); tr.append(td); });
      const total = document.createElement("td");
      total.className = "opt";
      total.textContent = n(per.Server + per.PS4 + per.PC);
      tr.append(total);
      rows.append(tr);
    });
    document.getElementById("tServer").textContent = n(sum.Server);
    document.getElementById("tPS4").textContent = n(sum.PS4);
    document.getElementById("tPC").textContent = n(sum.PC);
    document.getElementById("tTotal").textContent = n(sum.Server + sum.PS4 + sum.PC);
    document.getElementById("updated").textContent = t("updated") + ": " +
      new Date().toLocaleTimeString(lang === "de" ? "de-DE" : "en-GB", { hour: "2-digit", minute: "2-digit" });
    renderVisitors();
  }

  function renderVisitors() {
    if (!GOATCOUNTER) return;
    const base = "https://" + GOATCOUNTER + ".goatcounter.com";
    const box = document.getElementById("visitors");
    box.replaceChildren();
    const tiles = document.createElement("ul");
    tiles.className = "tiles gc-tiles";
    const tile = (label) => {
      const li = document.createElement("li");
      li.className = "panel tile";
      const b = document.createElement("b");
      b.textContent = "–";
      const span = document.createElement("span");
      span.textContent = label;
      li.append(b, span);
      tiles.append(li);
      return b;
    };
    const unique = tile(t("unique"));
    unique.parentElement.classList.add("total");
    const views = tile(t("views"));
    const a = document.createElement("a");
    a.href = base;
    a.textContent = t("dashboard");
    box.append(tiles, a);
    fetch(base + "/counter/TOTAL.json").then((r) => (r.ok ? r.json() : null)).then((c) => {
      if (!c || c.count === undefined) { tiles.replaceWith(Object.assign(document.createElement("p"), { textContent: t("closed") })); return; }
      unique.textContent = c.count_unique;
      views.textContent = c.count;
    }).catch(() => { tiles.replaceWith(Object.assign(document.createElement("p"), { textContent: t("closed") })); });
  }

  function load() {
    fetch("https://api.github.com/repos/thecrewreborn/server/releases?per_page=100")
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((list) => { releases = list.filter((r) => !r.draft); render(); })
      .catch(() => { document.getElementById("rows").innerHTML = ""; document.getElementById("updated").textContent = t("failed"); });
  }

  document.getElementById("lang").addEventListener("click", (e) => { e.preventDefault(); lang = lang === "de" ? "en" : "de"; render(); });
  document.getElementById("refresh").addEventListener("click", load);
  setInterval(load, 5 * 60 * 1000);
  render();
  load();
})();
</script>
</body>
</html>
